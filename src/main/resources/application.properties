spring.application.name=spencers-cardtopia-gestao
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/cardtopia_db}
spring.datasource.username=${DB_USER:cardtopia_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.error.include-message=never
app.admin.username=${APP_ADMIN_USER:admin}
app.admin.password=${APP_ADMIN_PASSWORD}
