<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Acesso seguro')}"></head>
<body class="login-body">
<div class="login-panel">
  <div class="login-badge">SC</div><div class="eyebrow">PAINEL ADMINISTRATIVO</div>
  <h1>Bem-vindo à<br/><em>Cardtopia.</em></h1>
  <p>Gestão de produtos, clientes e vendas em um só lugar.</p>
  <div th:if="${param.error}" class="notice error">Usuário ou senha inválidos.</div>
  <div th:if="${param.logout}" class="notice success">Sua sessão foi encerrada.</div>
  <form th:action="@{/login}" method="post" class="login-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>Usuário<input name="username" autocomplete="username" placeholder="Seu usuário" required/></label>
    <label>Senha<input name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required/></label>
    <button class="btn primary full" type="submit">Entrar no sistema →</button>
  </form>
  <div class="login-footer">PROJETO SPENCER'S CARDTOPIA</div>
</div></body></html>
