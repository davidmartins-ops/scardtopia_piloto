<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/base :: head('Cadastro de produto')}"></head><body>
<aside th:replace="~{fragments/base :: sidebar}"></aside><main class="workspace"><div class="topbar"><span>GESTÃO <b>/ PRODUTOS / FORMULÁRIO</b></span></div>
<div class="page-title"><div><div class="eyebrow">CATÁLOGO / CADASTRO</div><h1 th:text="${produto.id == null} ? 'Novo produto.' : 'Editar produto.'">Novo produto.</h1><p>Campos marcados com * são obrigatórios.</p></div><a class="btn outline" th:href="@{/produtos}">← Voltar</a></div>
<section class="form-panel"><form method="post" th:action="@{/produtos/salvar}" th:object="${produto}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" th:field="*{id}"/>
<div class="notice error" th:if="${#fields.hasGlobalErrors()}"><span th:each="e : ${#fields.globalErrors()}" th:text="${e}"></span></div>
<div class="form-grid"><label class="span-2">Nome do produto *<input th:field="*{nome}" maxlength="100" placeholder="Ex.: Secret Lair x Dune: Spice" required/><small class="field-error" th:errors="*{nome}"></small></label>
<label>Código / SKU *<input th:field="*{codigo}" maxlength="40" placeholder="Ex.: DUNE-SPICE-F" required/><small class="field-error" th:errors="*{codigo}"></small></label>
<label>Categoria *<input th:field="*{categoria}" maxlength="80" placeholder="Ex.: Secret Lair" required/><small class="field-error" th:errors="*{categoria}"></small></label>
<label>Edição / coleção *<input th:field="*{edicao}" maxlength="80" placeholder="Ex.: My Arrakis, My Superdrop" required/><small class="field-error" th:errors="*{edicao}"></small></label>
<label>Preço em reais (R$) *<input th:field="*{preco}" type="number" step="0.01" min="0.01" placeholder="450.00" required/><small class="field-error" th:errors="*{preco}"></small></label>
<label>Estoque disponível *<input th:field="*{estoque}" type="number" min="0" step="1" required/><small class="field-error" th:errors="*{estoque}"></small></label>
<label class="checkbox-field"><input th:field="*{foil}" type="checkbox"/> Acabamento Foil</label></div>
<div class="form-actions"><a th:href="@{/produtos}" class="btn outline">Cancelar</a><button class="btn primary" type="submit">Salvar produto →</button></div></form></section></main></body></html>
