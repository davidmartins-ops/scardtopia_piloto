<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/base :: head('Clientes')}"></head><body>
<aside th:replace="~{fragments/base :: sidebar}"></aside><main class="workspace"><div class="topbar"><span>GESTÃO <b>/ CLIENTES</b></span><div class="topbar-user">BASE DE CLIENTES <span class="avatar">SC</span></div></div>
<div th:replace="~{fragments/base :: notificacoes}"></div><div class="page-title"><div><div class="eyebrow">RELACIONAMENTO</div><h1>Cadastro <em>de clientes.</em></h1><p>Consulte e organize os dados dos compradores.</p></div><a th:href="@{/clientes/novo}" class="btn primary">+ Novo cliente</a></div>
<section class="panel"><div class="panel-head"><div><div class="section-kicker">CLIENTES</div><h2>Base cadastrada</h2></div><form th:action="@{/clientes}" method="get" class="search-form"><input type="search" name="busca" placeholder="Buscar por nome" th:value="${busca}"/><button class="btn outline" type="submit">Buscar</button></form></div>
<div class="table-wrap"><table><thead><tr><th>NOME</th><th>E-MAIL</th><th>TELEFONE</th><th>AÇÕES</th></tr></thead><tbody>
<tr th:each="c : ${clientes}"><td class="td-strong" th:text="${c.nome}">Nome</td><td th:text="${c.email}">E-mail</td><td th:text="${c.telefone}">Telefone</td><td><div class="actions"><a class="text-link" th:href="@{/clientes/{id}/editar(id=${c.id})}">Editar</a><form method="post" th:action="@{/clientes/{id}/excluir(id=${c.id})}" data-confirm="Excluir este cliente?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="link-danger" type="submit">Excluir</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(clientes)}"><td colspan="4" class="empty">Nenhum cliente cadastrado.</td></tr>
</tbody></table></div></section></main></body></html>
