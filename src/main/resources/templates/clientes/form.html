<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/base :: head('Cadastro de cliente')}"></head><body>
<aside th:replace="~{fragments/base :: sidebar}"></aside><main class="workspace"><div class="topbar"><span>GESTÃO <b>/ CLIENTES / FORMULÁRIO</b></span></div>
<div class="page-title"><div><div class="eyebrow">RELACIONAMENTO / CADASTRO</div><h1 th:text="${cliente.id == null} ? 'Novo cliente.' : 'Editar cliente.'">Novo cliente.</h1><p>Campos marcados com * são obrigatórios.</p></div><a class="btn outline" th:href="@{/clientes}">← Voltar</a></div>
<section class="form-panel"><form method="post" th:action="@{/clientes/salvar}" th:object="${cliente}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" th:field="*{id}"/>
<div class="notice error" th:if="${#fields.hasGlobalErrors()}"><span th:each="e : ${#fields.globalErrors()}" th:text="${e}"></span></div>
<div class="form-grid"><label class="span-2">Nome completo *<input th:field="*{nome}" maxlength="100" required placeholder="Nome do cliente"/><small class="field-error" th:errors="*{nome}"></small></label>
<label>E-mail *<input th:field="*{email}" type="email" maxlength="150" required placeholder="cliente@email.com"/><small class="field-error" th:errors="*{email}"></small></label>
<label>Telefone / WhatsApp *<input th:field="*{telefone}" maxlength="25" required placeholder="(11) 99999-9999"/><small class="field-error" th:errors="*{telefone}"></small></label></div>
<div class="form-actions"><a th:href="@{/clientes}" class="btn outline">Cancelar</a><button class="btn primary" type="submit">Salvar cliente →</button></div></form></section></main></body></html>
