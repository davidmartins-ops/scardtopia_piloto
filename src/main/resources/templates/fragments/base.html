<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${titulo} + ' | Spencer’s Cardtopia'">Spencer’s Cardtopia</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"/>
  <script defer th:src="@{/js/app.js}" src="/js/app.js"></script>
</head>
<body>
<aside class="sidebar" th:fragment="sidebar">
  <a class="brand" th:href="@{/}"><span class="brand-mark">SC</span><span><b>SPENCER’S</b><small>CARDTOPIA <i>GESTÃO</i></small></span></a>
  <div class="nav-caption">MENU PRINCIPAL</div>
  <nav class="menu">
    <a th:classappend="${pagina == 'dashboard'} ? 'active' : ''" th:href="@{/}"><span>▦</span> Visão geral</a>
    <a th:classappend="${pagina == 'produtos'} ? 'active' : ''" th:href="@{/produtos}"><span>⬡</span> Produtos</a>
    <a th:classappend="${pagina == 'clientes'} ? 'active' : ''" th:href="@{/clientes}"><span>♙</span> Clientes</a>
    <a th:classappend="${pagina == 'vendas'} ? 'active' : ''" th:href="@{/vendas}"><span>▤</span> Ordens</a>
  </nav>
  <div class="sidebar-bottom"><div class="security-dot">● SISTEMA PROTEGIDO</div><p>Projeto acadêmico · Execução local</p>
    <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn-logout" type="submit">Sair da conta ↗</button></form>
  </div>
</aside>
<div th:fragment="notificacoes">
    <div th:if="${sucesso}" class="notice success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="notice error" th:text="${erro}"></div>
</div>
</body></html>
