<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/base :: head('Ordens')}"></head><body>
<aside th:replace="~{fragments/base :: sidebar}"></aside><main class="workspace"><div class="topbar"><span>GESTÃO <b>/ ORDENS</b></span><div class="topbar-user">PEDIDOS <span class="avatar">SC</span></div></div>
<div th:replace="~{fragments/base :: notificacoes}"></div><div class="page-title"><div><div class="eyebrow">PEDIDOS E MOVIMENTAÇÕES</div><h1>Gestão <em>de ordens.</em></h1><p>Registre ordens e acompanhe a reserva automática de estoque.</p></div><a class="btn primary" th:href="@{/vendas/nova}">+ Registrar ordem</a></div>
<section class="panel"><div class="panel-head"><div><div class="section-kicker">HISTÓRICO</div><h2>Ordens registradas</h2></div></div>
<div class="table-wrap"><table><thead><tr><th>DATA</th><th>CLIENTE</th><th>PRODUTO</th><th>QTD.</th><th>TOTAL</th><th>STATUS</th><th>AÇÕES</th></tr></thead><tbody>
<tr th:each="v : ${vendas}"><td class="mono" th:text="${#temporals.format(v.criadoEm, 'dd/MM/yyyy HH:mm')}">data</td><td class="td-strong" th:text="${v.cliente.nome}">Cliente</td><td th:text="${v.produto.nome}">Produto</td><td th:text="${v.quantidade}">1</td><td th:text="'R$ ' + ${#numbers.formatDecimal(v.total, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td><td><span class="pill" th:classappend="${v.status.name().toLowerCase()}" th:text="${v.status}">PENDENTE</span></td><td><div class="actions"><a class="text-link" th:href="@{/vendas/{id}/editar(id=${v.id})}">Editar</a><form method="post" th:action="@{/vendas/{id}/excluir(id=${v.id})}" data-confirm="Excluir esta ordem e liberar estoque reservado?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit" class="link-danger">Excluir</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(vendas)}"><td colspan="7" class="empty">Nenhuma ordem registrada.</td></tr>
</tbody></table></div></section></main></body></html>
